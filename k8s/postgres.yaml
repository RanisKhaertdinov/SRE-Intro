# YOUR TASK: Write a Deployment + Service for PostgreSQL
# Requirements:
# - Deployment: 1 replica, image: postgres:17-alpine
# - Environment variables: POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD (all "quickticket")
# - Container port: 5432
# - Service: ClusterIP, port 5432
#
# Hint: Look at your docker-compose.yaml for the env vars
# Hint: Lecture slide 7 shows the Deployment format
# Hint: Lecture slide 8 shows the Service format

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "quickticket"
            - name: POSTGRES_USER
              value: "quickticket"
            - name: POSTGRES_PASSWORD
              value: "quickticket"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
